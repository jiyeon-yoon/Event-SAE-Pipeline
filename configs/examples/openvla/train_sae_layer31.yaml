# Example: train one BatchTopK SAE on layer-31 openVLA residual activations
# previously collected by `scripts/collect_activations.py`.

data_dir: logs/openvla/EVAL-libero_spatial-openvla-DATE_TIME/sae_activations/post_mlp_residual
layer_idx: 31

# openVLA hidden width
activation_dim: 4096

# SAE configuration (paper used d=32768, k=64)
dict_size: 32768
k: 64

# Event-SAE paper OpenVLA setting (Appendix): 4k steps, lr=5e-5.
lr: 5.0e-5
steps: 4000
batch_size: 40000

run_tag: libero_spatial

# Set wandb_project to enable logging. Empty disables wandb.
wandb_project: ""
wandb_group: ""
