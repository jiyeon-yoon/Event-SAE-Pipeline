# Example: collect openVLA layer-31 post-MLP residual activations during a
# LIBERO-Spatial closed-loop rollout. Edit checkpoint / task suite / layer
# indices as needed.

model:
  checkpoint: openvla/openvla-7b-finetuned-libero-spatial
  # Stable model revision used for repeatable evaluation.
  revision: 962318cec55ac10993ff0f5f43eda9a270b4c873
  code_revision: 47a0ec7fc4ec123775a391911046cf33cf9ed83f
  center_crop: true

env:
  task_suite_name: libero_spatial
  num_trials_per_task: 50  # Event-SAE paper: 50 closed-loop rollouts per task
  task_ids: ""        # empty = all tasks in the suite
  seed: 0

logging:
  root_dir: logs/openvla
  save_video: true              # rollout MP4s (visual sanity check)
  save_actions: true            # per-episode action traces (JSON)
  save_prompt_records: true     # task description + prompt per episode (JSONL)
  save_trajectory_records: true # eef pose / gripper per step (JSONL) — needed for AWE keyframe extraction

sae_collect:
  enabled: true
  layer_idxs: "31"    # comma-separated, e.g., "0,16,24,31"
  flush_every: 50000
